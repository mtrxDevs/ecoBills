[package]
name = "ecobills"
version = "0.1.1"
description = "ecoBills desktop shell (Tauri v2) — wraps the web build in apps/web/dist"
authors = ["mtrxWorks"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ecobills_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# tray-icon: required by `app.trayIcon` in tauri.conf.json (Phase 7 tray + low-stock badge).
# image-png: required to decode the PNG tray/bundle icons at runtime.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
