name: ci

on:
  push:
  pull_request:

# Milestone 0 gate: install → typecheck → lint → test → build, on every push.
# Integration tests need a live Postgres; without CI_DATABASE_URL they skip
# (by design) and unit tests still gate the change. The dummy URLs below are
# non-secrets — only present so `prisma generate` (offline) can validate config.
env:
  DATABASE_URL: ${{ secrets.CI_DATABASE_URL || 'postgresql://ci:ci@localhost:5432/ci?schema=public' }}
  DIRECT_URL: ${{ secrets.CI_DIRECT_URL || 'postgresql://ci:ci@localhost:5432/ci?schema=public' }}

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
